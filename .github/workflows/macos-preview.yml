name: macOS preview disk image

# Deliberately NOT [main]. This workflow must never run on the production
# branch. It publishes only to the preview-macos prerelease and cannot touch
# latest-windows or preview-windows.
on:
  push:
    branches: [ui-redesign-cw]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-macos
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon runner: the backend bundle is built for the arch it runs
    # on, and that is the arch the disk image is for.
    runs-on: macos-14
    # Same guard as the Windows preview: workflow_dispatch has no branch or
    # repository restriction of its own. Runs on the fork or the parent
    # repository, and publishes only to that repository's preview prerelease.
    if: github.repository == 'Feches/Spine-Contour' || github.repository == 'mjayasur/Spine-Contour'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download model weights
        run: git lfs pull

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller==6.22.2

      - name: Bundle OCR runtime
        run: |
          brew install tesseract
          python tools/build/bundle_ocr_macos.py build/ocr

      - name: Test backend
        run: python -m pytest backend/tests -q

      - name: Test renderer
        # Directory form is broken on Node 24 (treats it as a CJS entry point).
        # Glob form is the one verified to work. See the architecture contract.
        # node --test exits 0 and reports "tests 0" if the glob matches no
        # files, so an exit-code check alone is not enough - parse the pass
        # count out of the runner's own output and fail loudly if it is zero.
        shell: bash
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee test-output.log
          test_exit=${PIPESTATUS[0]}
          pass_count=$(grep -oE 'pass [0-9]+$' test-output.log | tail -1 | grep -oE '[0-9]+$')
          echo "renderer test pass count: ${pass_count:-<none found>}"
          if [ "$test_exit" -ne 0 ]; then
            echo "FAIL: node --test exited non-zero ($test_exit)" >&2
            exit 1
          fi
          if [ -z "$pass_count" ] || [ "$pass_count" -eq 0 ]; then
            echo "FAIL: 0 renderer tests ran (glob matched nothing, or every test was skipped) - a green gate that ran nothing is worse than no gate" >&2
            exit 1
          fi
          echo "OK: $pass_count renderer test(s) passed"

      - name: Bundle backend
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name spine-contour-backend
          --distpath backend-dist
          --workpath build/pyinstaller
          --paths .
          --collect-all segmentation_models_pytorch
          --collect-all timm
          --collect-all torchvision
          --collect-all uvicorn
          --add-data "backend/weights:backend/weights"
          --add-data "build/ocr:ocr"
          backend/standalone.py

      - name: Verify bundled backend
        shell: bash
        run: |
          ./backend-dist/spine-contour-backend/spine-contour-backend --host 127.0.0.1 --port 8765 &
          backend=$!
          ready=0
          for attempt in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -eq 1 ]; then
            python tools/build/check_bundled_ocr.py || { kill "$backend"; exit 1; }
          fi
          kill "$backend" 2>/dev/null || true
          if [ "$ready" -ne 1 ]; then echo "The bundled backend did not become ready." >&2; exit 1; fi
          echo "OK: bundled backend answered /health"

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Reclaim disk before packaging
        run: rm -rf build/pyinstaller && python -m pip cache purge || true

      - name: Assert packaging allowlists agree
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const prod = JSON.parse(fs.readFileSync('package.json', 'utf8')).build.files;
          const yml = fs.readFileSync('electron-builder.preview.yml', 'utf8');
          // windows-latest checks the repo out with CRLF line endings (no .gitattributes
          // rule forces LF for .yml), so a bare \n here made this match fail on every run
          // and it never actually guarded anything.
          const block = yml.match(/^files:\r?\n((?:[ \t]+- .*\r?\n)+)/m);
          if (!block) {
            console.error('FAIL: no files: block found in electron-builder.preview.yml');
            process.exit(1);
          }
          const prev = block[1].trimEnd().split('\n')
            .map(s => s.replace(/^\s*-\s*/, '').trim().replace(/^['"]|['"]$/g, ''));
          console.log('package.json build.files       :', JSON.stringify(prod));
          console.log('electron-builder.preview files :', JSON.stringify(prev));
          const a = JSON.stringify([...prod].sort());
          const b = JSON.stringify([...prev].sort());
          if (a !== b) {
            console.error('FAIL: the two packaging allowlists have diverged.');
            console.error('A missing entry does not fail the build - it ships an installer that opens a blank window.');
            console.error('Add the entry to BOTH package.json build.files and electron-builder.preview.yml files:.');
            process.exit(1);
          }
          console.log('OK: allowlists match');
          NODE

      - name: Build macOS preview disk image
        run: npm run package:mac:preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Assert the production image was not produced
        shell: bash
        run: |
          if ls dist/Spine-Contour-macOS-*.dmg >/dev/null 2>&1; then
            echo "Production artifact was built by the preview workflow. The preview config is wrong." >&2; exit 1
          fi
          if ! ls dist/Spine-Contour-Preview-macOS-*.dmg >/dev/null 2>&1; then
            echo "Preview artifact missing." >&2; exit 1
          fi
          echo "OK: preview artifact present, production artifact absent"

      - uses: actions/upload-artifact@v7
        with:
          name: Spine-Contour-Preview-macOS
          path: dist/Spine-Contour-Preview-macOS-*.dmg
          compression-level: 0

      - name: Publish preview disk image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(ls dist/Spine-Contour-Preview-macOS-*.dmg | head -1)
          notes="PREVIEW BUILD — not the production release. Unsigned Apple Silicon disk image; right-click the app and choose Open the first time. Built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
          if gh release view preview-macos >/dev/null 2>&1; then
            gh release upload preview-macos "$asset" --clobber
            gh release edit preview-macos --title "Preview build (macOS)" --notes "$notes" --prerelease
          else
            gh release create preview-macos "$asset" --target "$GITHUB_SHA" --title "Preview build (macOS)" --notes "$notes" --prerelease
          fi
